# backend/docker-compose.yml
version: '3.8' # Указываем версию синтаксиса docker-compose

services:
  # Название сервиса (может быть любым, например, 'app', 'flask_api' и т.д.)
  backend:
    # Имя файла с инструкциями по сборке
    build:
       # Указывает, где находится Dockerfile и исходный код. '.' означает текущую директорию (backend/)
      context: ./Backend
      # Имя файла с инструкциями по сборке
      dockerfile: Backend/dockerfile

    container_name: flask_backend
    # Порты, которые будут проброшены.
    # Формат: HOST_PORT:CONTAINER_PORT
    # Это означает, что порт 5000 на вашем компьютере (хост) будет доступен
    # через порт 5000 внутри контейнера.
    ports:
      - "5000:5000"

 # Монтирование томов (Volumes).
    # Это позволяет синхронизировать файлы между хостом и контейнером.
    # Это очень полезно для разработки: изменения в коде на вашем компьютере
    # сразу же отражаются в контейнере без необходимости пересборки образа.
    # Формат: HOST_PATH:CONTAINER_PATH
    volumes:
      - ./Backend:/app # Монтируем текущую директорию (backend/) в /app внутри контейнера.
               # Важно: Исключите папку venv, чтобы она не попала в контейнер.
               # Полностью: D:\PyCharmProjects\Web2\backend:/app

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile

    container_name: vue_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      # Если live-reload не срабатывает (особенно на Windows/macOS) — включите polling:
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 'bggg902080'
      POSTGRES_DB: 'web_labs_db'
      POSTGRES_USER: 'postgres'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local